<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Fiv-o: guided discovery for Nutanix sales engineers. Works offline; data stays in this browser.">
<title>Fiv-o · Discovery Navigator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235a48d8'/%3E%3Cpath d='M9 23V9h12M9 16h9' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* Fiv-o styles — quiet, line-based, mostly monochrome.
   Color is reserved for meaning: green = ready/solid, amber = pain/partial, red = risk. */
:root {
  --bg: #ffffff; --bg-soft: #f6f6f4; --sel: #f0efeb;
  --line: #e6e5e1; --line-strong: #d2d1cc;
  --text: #1c1c1a; --muted: #686762; --faint: #9a9993;
  --ink: #1c1c1a; --ink-text: #ffffff;
  --link: #2b5797;
  --good: #2d7a4c; --warn: #8a5a00; --bad: #b3261e;
  --radius: 8px; --r: 4px;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151515; --bg-soft: #1b1b1b; --sel: #242423;
    --line: #2a2a29; --line-strong: #3a3a38;
    --text: #ebebe8; --muted: #a09f99; --faint: #6c6b66;
    --ink: #ebebe8; --ink-text: #151515;
    --link: #8fb1e6;
    --good: #72c793; --warn: #d9ad55; --bad: #ee8a82;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151515; --bg-soft: #1b1b1b; --sel: #242423;
  --line: #2a2a29; --line-strong: #3a3a38;
  --text: #ebebe8; --muted: #a09f99; --faint: #6c6b66;
  --ink: #ebebe8; --ink-text: #151515;
  --link: #8fb1e6;
  --good: #72c793; --warn: #d9ad55; --bad: #ee8a82;
  color-scheme: dark;
}

/* ── base ── */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; accent-color: var(--text); }
h1, h2, h3, h4 { margin: 0; font-weight: 600; line-height: 1.25; }
h1 { font-size: 28px; letter-spacing: -.015em; }
h2 { font-size: 17px; }
h2.mt { margin-top: 26px; }
p { margin: 0 0 .6em; }
a { color: var(--link); }
ul, ol { margin: .3em 0 .6em; padding-left: 1.25em; }
li { margin: .2em 0; }
blockquote { margin: 8px 0; padding-left: 14px; border-left: 2px solid var(--line-strong); color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--mono); font-size: .9em; }
.pad { padding: 12px 18px; }
.hidden { display: none; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }

.eyebrow { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 8px; margin-bottom: 10px; font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.eyebrow .muted { font-weight: 500; }
.must { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--warn); margin-left: 8px; }

/* ── controls ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 14px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--bg); color: var(--text); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--text); }
.btn.primary { background: var(--ink); color: var(--ink-text); border-color: var(--ink); }
.btn.primary:hover { opacity: .88; }
.btn.lg { padding: 10px 20px; font-size: 15px; }
.btn.full { width: 100%; margin-top: 14px; }
.tbtn { display: inline-flex; align-items: center; gap: 4px; padding: 6px 8px; border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; }
.tbtn:hover { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
.tbtn.small { font-size: 13px; padding: 4px 6px; }
.tbtn.danger:hover { color: var(--bad); }
.link { padding: 0; border: 0; background: none; color: var(--text); font: inherit; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.link:hover { text-decoration-color: var(--text); }
input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--bg); color: var(--text); font: inherit; font-size: 14.5px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--text); }
textarea { resize: vertical; }
input::placeholder, textarea::placeholder { color: var(--faint); }
.lf { display: flex; flex-direction: column; gap: 5px; }
.lf > span { font-size: 12.5px; font-weight: 500; color: var(--muted); }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
.check input { width: auto; margin-top: 4px; }
.hstack { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ── line-based rows (topic review, variants, pickers) ── */
.rows { border-top: 1px solid var(--line); }
.rows > .row { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; align-items: baseline; width: 100%; padding: 12px 4px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
.rows > .row:hover { background: var(--bg-soft); }
.row.static { cursor: default; }
.rows > .row.static:hover { background: none; }
.row.on { background: var(--sel); box-shadow: inset 3px 0 0 var(--text); padding-left: 14px; }
.rows > .row.on:hover { background: var(--sel); }
.row.stack { grid-template-columns: 1fr; gap: 8px; }
.row.pick { grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 12px; }
.row.pick input { width: auto; margin: 0; }
.row-q { font-weight: 500; }
.row-a { color: var(--muted); font-size: 14px; }
.row.open .row-a, .row.skipped .row-a { color: var(--faint); }
.row.skipped .row-a { font-style: italic; }
.row.stale .row-a { color: var(--warn); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ── pages: home, setup, recap, wrap ── */
.page { max-width: 1080px; margin: 0 auto; padding: 28px 24px 72px; }
.page.setup { max-width: 640px; }
.topbar { display: flex; align-items: center; gap: 12px; margin: 0 0 20px -8px; }
.wordmark { flex: none; padding: 0; border: 0; background: none; color: var(--text); font: inherit; font-size: 17px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; cursor: pointer; }
.wordmark.lg { font-size: 22px; cursor: default; }
.home-head { display: flex; align-items: baseline; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.home-hero { padding: 56px 0 44px; border-bottom: 1px solid var(--line); }
.home-hero h1 { font-size: 34px; margin-bottom: 14px; }
.lede { max-width: 620px; margin: 0 0 26px; font-size: 17px; color: var(--muted); }
.home-sec { padding: 28px 0; border-bottom: 1px solid var(--line); }
.home-sec h2 { margin-bottom: 14px; }
.slist { border-top: 1px solid var(--line); }
.srow { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) auto; gap: 20px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.srow-title { font-weight: 600; }
.srow-sub { font-size: 13px; color: var(--muted); }
.srow-pitch { font-size: 14px; }
.srow-actions { display: flex; align-items: center; gap: 2px; }
.steps-list { padding-left: 20px; color: var(--muted); max-width: 680px; }
.steps-list li { margin: 10px 0; }
.steps-list strong { color: var(--text); font-weight: 600; }
.foot { padding-top: 22px; font-size: 13px; color: var(--faint); }
.foot p { max-width: 720px; }

.form { margin-top: 28px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 22px; }
.field-label { font-size: 13.5px; font-weight: 600; }
.field-hint { font-size: 12.5px; color: var(--faint); }
.field input { padding: 10px 12px; font-size: 15px; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.toggle { padding: 7px 12px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--bg); color: var(--text); font: inherit; font-size: 14px; cursor: pointer; }
.toggle:hover { border-color: var(--text); }
.toggle.on { background: var(--ink); color: var(--ink-text); border-color: var(--ink); }
details.more { margin: 4px 0 24px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
details.more summary { cursor: pointer; font-weight: 500; color: var(--muted); }
details.more[open] summary { margin-bottom: 18px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.form-foot { display: flex; justify-content: flex-end; margin-top: 12px; }

.recap { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; margin-top: 12px; }
.recap .home-sec { border-bottom: 0; }
pre.small { font: 12.5px/1.5 var(--mono); white-space: pre-wrap; margin: 8px 0; color: var(--muted); }

/* ── live call ── */
.interview { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); height: 100vh; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 10px 24px; border-bottom: 1px solid var(--line); }
.bar-l, .bar-r { display: flex; align-items: center; gap: 14px; min-width: 0; }
.bar-l { flex: 1; }
.bar-r { gap: 4px; }
.bar-acct { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-meta { padding-left: 14px; border-left: 1px solid var(--line); color: var(--muted); font-size: 14px; white-space: nowrap; }
.bar .btn.primary { margin-left: 8px; }

.stepper { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 0 24px; border-bottom: 1px solid var(--line); }
.steps { display: flex; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.steps::-webkit-scrollbar { display: none; }
.step { display: inline-flex; align-items: baseline; gap: 7px; padding: 12px 12px 10px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); font: inherit; font-size: 14px; white-space: nowrap; cursor: pointer; }
.step:first-child { padding-left: 0; }
.step:hover { color: var(--text); }
.step.cur { color: var(--text); font-weight: 600; border-bottom-color: var(--text); }
.step-n { font: 12px var(--mono); color: var(--faint); }
.step.done .step-n { color: var(--good); }
.step-new { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--link); }
.step.add { color: var(--link); }
.step-meta { padding: 6px 0; border: 0; background: none; font: inherit; font-size: 13px; color: var(--warn); white-space: nowrap; cursor: pointer; }
.step-meta:hover { text-decoration: underline; text-underline-offset: 3px; }
.step-meta.ok { color: var(--good); cursor: default; text-decoration: none; }
.lastline.nudge { padding: 10px 0 10px 14px; border: 0; border-left: 2px solid var(--warn); }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) 320px; min-height: 0; }
.main { overflow-y: auto; }
.main-in { max-width: 760px; margin: 0 auto; padding: 36px 40px 96px; }
.side { overflow-y: auto; border-left: 1px solid var(--line); background: var(--bg-soft); }
.side-in { padding: 24px 22px 40px; }
.mtabs { display: none; }

.intro { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 28px; padding: 14px 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-soft); font-size: 14px; }
.intro ol { margin: 6px 0 0; padding-left: 18px; color: var(--muted); }
.lastline { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin-bottom: 28px; padding-bottom: 12px; border-bottom: 1px solid var(--line); font-size: 13.5px; }

.qtitle { margin-bottom: 8px; font-size: 26px; letter-spacing: -.015em; }
.qwhy { max-width: 62ch; margin: 0 0 4px; color: var(--muted); font-size: 14.5px; }
.qsplit { margin: 6px 0 0; font-size: 13.5px; color: var(--link); }
.qhint { margin: 18px 0 0; font-size: 13px; color: var(--faint); }
.opts { display: grid; margin-top: 18px; border-top: 1px solid var(--line); }
.opts.two { grid-template-columns: 1fr 1fr; column-gap: 32px; }
.opt { display: flex; align-items: center; gap: 14px; width: 100%; padding: 13px 12px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--text); font: inherit; font-size: 15px; text-align: left; cursor: pointer; }
.opt:hover { background: var(--bg-soft); }
.opt.on { background: var(--sel); font-weight: 600; box-shadow: inset 3px 0 0 var(--text); }
.opt-k { width: 14px; flex: none; font: 12px var(--mono); color: var(--faint); }
.opt-l { flex: 1; }
.opt-m { flex: none; font: 12.5px var(--mono); }
.fields { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }

.follow { margin-top: 18px; padding: 2px 0 2px 16px; border-left: 2px solid var(--line-strong); font-size: 14.5px; }
.follow p { margin: 3px 0 0; }
.follow-k { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.follow.tip { border-left-color: var(--link); } .follow.tip .follow-k { color: var(--link); }
.follow.risk { border-left-color: var(--bad); } .follow.risk .follow-k { color: var(--bad); }
.follow.pain { border-left-color: var(--warn); } .follow.pain .follow-k { color: var(--warn); }
.follow .pair { margin-top: 10px; }
.hint { margin: 8px 0 0; font-size: 13px; color: var(--faint); }
.notice { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--muted); }
.notice.warn { color: var(--warn); }

.qactions { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
.qa-main, .qa-links { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.qa-links { margin-right: -8px; }
.capture { margin-top: 16px; }
.quote { font-style: italic; }
.coach { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; }
.coach ul { margin: 6px 0 0; color: var(--muted); }

.upnext { margin-top: 48px; }
.upnext .eyebrow { margin-bottom: 4px; }
.next-row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; width: 100%; padding: 11px 0; border: 0; border-top: 1px solid var(--line); background: none; color: var(--muted); font: inherit; font-size: 14.5px; text-align: left; cursor: pointer; }
.next-row:last-child { border-bottom: 1px solid var(--line); }
.next-row:hover { color: var(--text); }
.next-row .muted { flex: none; font-size: 13px; }
.question.empty, .topic { padding-top: 8px; }

.fade { animation: fade .2s ease-out; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .fade, .overlay, .drawer { animation: none !important; } .meter-fill { transition: none !important; } }

/* ── phases and the number behind each pain ── */
.step-left { font-size: 12.5px; font-weight: 400; color: var(--muted); }
.painflag { margin-left: 8px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--warn); cursor: help; }
.phase-intro { margin-bottom: 28px; padding: 2px 0 2px 16px; border-left: 2px solid var(--text); }
.phase-intro-k { font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.phase-intro p { margin: 4px 0 0; font-size: 14.5px; }
.phase-intro .bridge { color: var(--muted); font-style: italic; }
.follow-sub { font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--text); }
.num-ask { margin: 6px 0 10px; font-size: 15px; font-style: italic; }
.num-ask.small { margin: 2px 0 4px; font-size: 13.5px; color: var(--muted); }
.num-row { display: grid; grid-template-columns: 110px 160px minmax(0, 1fr); gap: 8px; }
.num-amt { font-family: var(--mono); }
.num-foot { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 2px 12px; margin-top: 6px; }
.num-foot .tbtn { margin-right: -8px; }
.num-est { font-size: 13px; color: var(--muted); }
.num-later { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
.rows-head { margin: 24px 0 6px; font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.cost-big { margin: 2px 0 0; font-size: 18px; font-weight: 600; }
.cost-rest { margin: 2px 0 0; font-size: 13.5px; }
.side-sec .muted.small { margin: 4px 0 0; }
.tbtn.warnlink { padding-left: 0; color: var(--warn); white-space: normal; text-align: left; }
.cost-total { margin-top: 14px; }
.cost-total p { margin: 0 0 8px; }
.rate { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 4px; font-size: 13.5px; color: var(--muted); }
.rate-in { width: 64px; padding: 4px 8px; font-family: var(--mono); font-size: 13.5px; }

/* ── how to ask it (DISC) ── */
.key { margin-left: 8px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--link); cursor: help; }
.ask { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; margin-top: 4px; }
.ask-line { display: flex; align-items: baseline; gap: 10px; margin: 2px 0 0; max-width: 64ch; font-size: 15px; color: var(--muted); }
.ask-k { display: inline-grid; place-items: center; flex: none; width: 20px; height: 20px; border: 1px solid var(--line-strong); border-radius: 3px; font: 600 12px var(--mono); color: var(--text); }
.ask-toggle { padding-left: 0; font-size: 13px; }
.caret { margin-left: 5px; font-size: 10px; }
.askpanel { width: 100%; margin-top: 8px; padding-bottom: 10px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.askpanel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 0 6px; }
.askrow { display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 10px 8px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
.askrow:hover { background: var(--bg-soft); }
.askrow.on { background: var(--sel); box-shadow: inset 3px 0 0 var(--text); }
.askrow-body { display: flex; flex-direction: column; gap: 2px; }
.askrow-name { font-size: 12.5px; color: var(--muted); }
.askrow-q { font-size: 14.5px; }
.askpanel .coach { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-top: 6px; padding-top: 12px; }
.coach p { color: var(--muted); }

/* ── side: tabs, technology, license ── */
.side-tabs { margin: -6px 0 18px; border-bottom: 1px solid var(--line); }
.tab-hint { font-weight: 400; font-size: 12.5px; color: var(--muted); }
.tech { padding: 10px 0; border-bottom: 1px solid var(--line); }
.tech-top { display: flex; align-items: baseline; gap: 8px; }
.tech-name { padding: 0; border: 0; background: none; color: var(--text); font: inherit; font-size: 14.5px; font-weight: 600; text-align: left; cursor: pointer; }
.tech-name:hover { text-decoration: underline; text-underline-offset: 3px; }
.tech-why { margin: 2px 0 4px; font-size: 12.5px; color: var(--muted); }
.tech-act { display: flex; flex-wrap: nowrap; gap: 2px; margin-left: -6px; }
.rows > .row.wtech { grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px 16px; }
.wtech-main { display: flex; flex-direction: column; }
.wtech input { grid-column: 1 / -1; }
.tbtn.chosen { color: var(--good); font-weight: 600; }
.tbtn.chosen.no { color: var(--bad); }
.tech-sum { margin: 10px 0 0; font-size: 13px; }
.prow.declined .prow-name { color: var(--faint); text-decoration: line-through; }
.lic { padding: 10px 0; border-bottom: 1px solid var(--line); }
.side-sec .lic:last-child { border-bottom: 0; }
.lic-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.lic-title { font-size: 14.5px; font-weight: 600; }
.lic.main .lic-title { font-size: 18px; }
.lic-qty { flex: none; font: 12.5px var(--mono); color: var(--muted); white-space: nowrap; }
.lic-detail { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.lic-why, .lic-list { margin: 6px 0 0; padding-left: 16px; font-size: 13px; }
.lic-why li, .lic-list li { margin: 3px 0; }
.lic-sum { margin: 14px 0 0; font-size: 14px; }
.modal.wide { width: min(720px, calc(100vw - 32px)); }
.modal .rows { max-height: 58vh; overflow-y: auto; }
.rows > .row.tech-pick { grid-template-columns: minmax(0, 1fr) auto; align-items: center; }

      }, d.mustLeft ? `${d.mustLeft} must-ask${d.mustLeft > 1 ? 's' : ''} left` : 'Must-asks covered'));
  }

  // ── the focused question ──
  function options(q, a) {
    const sel = F.selected(q, a);
    return h('div.opts' + (q.options.length > 7 ? '.two' : ''), { role: 'group', 'aria-label': q.text },
      q.options.map((o, i) => {
        const on = sel.includes(o.id);
        const rank = q.ranked && on ? sel.indexOf(o.id) + 1 : null;
        return h('button.opt' + (on ? '.on' : ''), {
          'aria-pressed': on ? 'true' : 'false',
          onclick: () => F.ui.pick(q.id, o.id),
        },
        h('span.opt-k', i < KEYS.length ? KEYS[i] : ''),
        h('span.opt-l', o.label),
        h('span.opt-m', rank ? `#${rank}` : on ? '✓' : ''));
      }));
  }

  function followUps(q, a) {
    const { ui } = app;
    const out = [];
    const opts = F.selected(q, a).map((id) => q.options.find((o) => o.id === id)).filter(Boolean);
    opts.filter((o) => o.flag).forEach((o) => out.push(h('div.follow.risk', h('div.follow-k', 'Risk'), h('p', o.flag))));
    if (ui.coaching) opts.filter((o) => o.tip).forEach((o) => out.push(h('div.follow.tip', h('div.follow-k', 'Coach'), h('p', o.tip))));
    opts.filter((o) => o.pain).forEach((o) => {
      const p = app.d.pains.find((x) => x.qid === q.id && x.opt === o.id);
      if (p) out.push(numberBlock(q, o, p));
    });
    return out;
  }

  // "Get the number": the question to ask, the number and its unit, and what it means.
  // Enter moves on (to the next pain's number, or the next question).
  function numberBlock(q, o, p) {
    const k = `${q.id}.${o.id}`;
    const set = (field, v) => app.soft((x) => F.state.setPain(x, q.id, o.id, field, v));
    const onKey = (e) => { if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); F.ui.afterNumber(q.id, o.id); } };
    const est = p.value ? F.costs.estimate(p.value, app.s) : '';
    return h('div.follow.pain',
      h('div.follow-k', 'Get the number', h('span.follow-sub', ` — ${p.label}`)),
      h('p.num-ask', `“${p.ask}”`),
      p.later
        ? h('p.num-later', 'No number yet — it’s on the next call’s agenda. ',
          h('button.link', { onclick: () => app.act((x) => F.state.setPain(x, q.id, o.id, 'later', false)) }, 'Add one now'))
        : [
          h('div.num-row',
            h('input.num-amt', { 'data-key': `pa.${k}`, placeholder: F.costs.unitById[p.unit].eg, 'aria-label': `The number for: ${p.label}`, value: p.amount, oninput: (e) => set('amount', e.target.value), onkeydown: onKey }),
            h('select.num-unit', { 'data-key': `pu.${k}`, 'aria-label': 'Unit', onchange: (e) => app.act((x) => F.state.setPain(x, q.id, o.id, 'unit', e.target.value)) },
              F.meta.units.map((u) => h('option', { value: u.id, selected: u.id === p.unit ? 'selected' : null }, u.label))),
            h('input.num-impact', { 'data-key': `pi.${k}`, placeholder: 'What it means for the business (optional)', 'aria-label': 'Impact', value: p.impact, oninput: (e) => set('impact', e.target.value), onkeydown: onKey })),
          h('div.num-foot',
            h('span.num-est', est || (p.value ? p.value.text : 'Hours, dollars, days, people — whatever they can give you.')),
            p.amount ? null : h('button.tbtn.small', { onclick: () => app.act((x) => F.state.setPain(x, q.id, o.id, 'later', true)) }, 'No number yet — ask next call')),
        ]);
  }

  // DISC: with the buyer's style set, its phrasing sits under the question; the dropdown
  // shows all four ways to ask it plus the coaching (why ask, listen for, dig deeper).
  F.ui.toggleAsk = () => app.setPref('askOpen', !app.ui.askOpen);
  function howToAsk(q) {
    const { s, ui } = app;
    const ask = F.disc.ask[q.id] || {};
    const style = s.setup.disc;
    const cur = style && F.disc.styles.find((x) => x.k === style);
    const open = ui.askOpen;
    const out = [h('div.ask',
      cur && ask[style] ? h('p.ask-line', h('span.ask-k', { title: `${cur.name}: ${cur.cue}` }, cur.label), h('span', `“${ask[style]}”`)) : null,
      h('button.tbtn.ask-toggle', { onclick: F.ui.toggleAsk, 'aria-expanded': open ? 'true' : 'false', title: 'Four ways to ask it, one per DISC style  (H)' },
        open ? 'Hide' : cur ? 'Other ways to ask' : 'How to ask it', h('span.caret', open ? '▴' : '▾')))];
    if (!open) return out;
    out.push(h('div.askpanel',
      h('div.askpanel-head', h('span.follow-k', 'Ask it their way'), h('span.muted.small', 'Click a style to set it for this buyer')),
      F.disc.styles.map((x) => h('button.askrow' + (style === x.k ? '.on' : ''), {
        onclick: () => app.act((ss) => { ss.setup.disc = ss.setup.disc === x.k ? '' : x.k; }),
        title: style === x.k ? 'Clear the buyer’s style' : `Set ${x.name} as the buyer’s style`,
      },
      h('span.ask-k', x.label),
      h('span.askrow-body', h('span.askrow-name', `${x.name} — ${x.cue.toLowerCase()}`), h('span.askrow-q', `“${ask[x.k]}”`)))),
      ui.coaching ? h('div.coach',
        h('div', h('div.follow-k', 'Why ask'), h('p', q.why)),
        q.listen && q.listen.length ? h('div', h('div.follow-k', 'Listen for'), h('ul', q.listen.map((x) => h('li', x)))) : null,
        q.probes && q.probes.length ? h('div', h('div.follow-k', 'Dig deeper'), h('ul', q.probes.map((x) => h('li', x)))) : null) : null));
    return out;
  }

  function questionBlock(qid, isNew) {
    const q = F.questionById[qid];
    const { s, d, ui } = app;
    const a = s.answers[qid];
    const answered = F.isAnswered(q, a);
    const stale = d.stale[qid];
    const locked = !d.eligible[qid];
    const pinned = ui.pinned === qid;
    const lastQ = s.lastAnswered && F.questionById[s.lastAnswered];
    const catchUp = !answered && !MOD[q.module].generic && ((ui.focusModule === q.module && d.focusLeft) || (lastQ && lastQ.phase > q.phase && !pinned));

    const out = [];
    out.push(h('div.eyebrow',
      h('span', PH[q.phase].label),
      topicLabel(q) ? h('span.muted', ` · ${topicLabel(q)}`) : null,
      catchUp ? h('span.muted', ' · catching up') : null,
      q.type === 'multi' ? h('span.muted', q.ranked ? ' · in priority order' : ' · pick all that apply') : null,
      hasPain(q) ? h('span.painflag', { title: 'If they name a pain here, ask for the number — hours, dollars, people — before moving on.' }, 'Pain? Get the number') : null,
      q.mustAsk ? h('span.must', 'Must ask') : null,
      d.split[qid] ? h('span.key', { title: `This answer decides: ${d.split[qid]}` }, 'Key question') : null,
      pinned && answered && ui.held !== qid ? h('span.muted', ' · editing') : null));
    out.push(h('h1.qtitle', q.text));
    out.push(...howToAsk(q));

    if (q.type === 'single' || q.type === 'multi') {
      out.push(options(q, a));
    } else if (q.type === 'fields') {
      out.push(h('div.fields', q.fields.map((f) => h('label.lf',
        h('span', f.label.charAt(0).toUpperCase() + f.label.slice(1) + (f.unit ? ` (${f.unit})` : '')),
        h('input', {
          inputmode: 'numeric', value: (a && a.value && a.value[f.id]) || '', 'data-key': `f.${q.id}.${f.id}`,
          oninput: (e) => app.soft((x) => F.state.setField(x, q.id, f.id, e.target.value)),
          onkeydown: (e) => { if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); app.done(q.id); } },
        })))));
    } else {
      out.push(h('textarea', {
        rows: 2, 'data-key': `t.${q.id}`, placeholder: 'Type their answer…',
        oninput: (e) => app.soft((x) => F.state.setText(x, q.id, e.target.value)),
        onkeydown: (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); e.stopPropagation(); app.done(q.id); } },
      }, (a && a.value) || ''));
    }

    out.push(...followUps(q, a || { pains: {} }));
    if (stale) out.push(h('p.notice.warn', 'This answer no longer applies because an earlier answer changed. It’s kept for reference but doesn’t count.'));
    else if (locked) out.push(h('p.notice', `Not in play yet — it appears when ${requirement(q) || 'its topic is opened'}. You can still record it.`));
    else if (d.aside[q.module] && !answered) out.push(h('p.notice', 'This topic is set aside — the customer isn’t interested in what it covers. You can still record an answer.'));

    // Actions: the main move on the left, capture links on the right.
    const main = [];
    if (q.type !== 'single') main.push(h('button.btn.primary', { onclick: () => F.ui.finish(q.id) }, F.hasValue(q, a) ? 'Done' : 'None of these'));
    else if (pinned && answered) main.push(h('button.btn.primary', { onclick: () => app.proceed(q.id) }, 'Next question'));
    if (!answered) main.push(h('button.tbtn', { onclick: () => app.skip(q.id) }, 'Skip'));
    if (a && F.hasValue(q, a) && (pinned || stale)) main.push(h('button.tbtn.danger', { onclick: () => app.clear(q.id) }, 'Clear answer'));
    if (pinned && !answered) main.push(h('button.tbtn', { onclick: () => { ui.pinned = null; ui.active = null; app.render(); } }, 'Back to the flow'));

    const noteOpen = ui.openNote[qid] || (a && a.note);
    const quoteOpen = ui.openQuote[qid] || (a && a.quote);
    const links = [
      !noteOpen ? h('button.tbtn', { onclick: () => F.ui.openNote(qid) }, q.detail ? `+ ${q.detail}` : '+ Note') : null,
      !quoteOpen ? h('button.tbtn', { onclick: () => F.ui.openQuote(qid) }, '+ Quote') : null,
    ];
    out.push(h('div.qactions', h('div.qa-main', main), h('div.qa-links', links)));

    if (noteOpen) {
      out.push(h('label.lf.capture',
        h('span', q.detail || 'Note'),
        h('input', {
          placeholder: q.detail ? `${q.detail}…` : 'Anything worth remembering', value: (a && a.note) || '', 'data-key': `note.${q.id}`,
          oninput: (e) => app.soft((x) => F.state.setNote(x, q.id, e.target.value)),
          onkeydown: (e) => { if (e.key === 'Enter') e.target.blur(); },
        })));
    }
    if (quoteOpen) {
      out.push(h('label.lf.capture',
        h('span', 'In their words'),
        h('textarea.quote', {
          rows: 2, placeholder: 'Type exactly what they said', 'data-key': `quote.${q.id}`,
          oninput: (e) => app.soft((x) => F.state.setQuote(x, q.id, e.target.value)),
        }, (a && a.quote) || '')));
    }

    return h('section.question' + (isNew ? '.fade' : ''), { 'aria-label': q.text }, out);
  }

  function intro() {
    return h('div.intro',
      h('div',
        h('strong', 'How this works'),
        h('ol',
          h('li', 'Ask the question on screen and click what they say — or press its number.'),
          h('li', 'The call runs in five phases, in order: why now, environment, pain & cost, change & risk, decision. The likely Nutanix pitch builds on the right.'),
          h('li', 'When they name a pain, Fiv-o asks for the number — hours, dollars, people — before you move on.'),
          h('li', 'Click a phase above to review or change answers. Press Wrap up when you’re done.'))),
      h('button.tbtn', { onclick: () => { prefs.set('introSeen', true); app.render(); } }, 'Got it'));
  }

  function questionView() {
    const { s, d, ui } = app;
    const ids = cluster();
    const act = activeOf(ids);
    const isNew = act !== ui.prevActive;
    if (isNew && ui.prevActive !== null) ui.resetMain = true;
    ui.prevActive = act;

    const parts = [];
    if (!prefs.get('introSeen', false)) parts.push(intro());

    const last = s.lastAnswered && F.questionById[s.lastAnswered];
    const la = last && s.answers[last.id];
    if (last && la && F.hasValue(last, la) && last.id !== act) {
      parts.push(h('div.lastline',
        h('span.muted', 'Saved'), h('span', `${last.short}: ${F.answerText(last, la)}`),
        ui.undo ? h('button.tbtn', { onclick: app.undo, title: 'Undo  (B)' }, 'Undo') : null));
    }
    const call = s.calls[s.calls.length - 1];
    const minutes = call.startedAt ? (Date.now() - call.startedAt) / 60000 : 0;
    const decisionLeft = d.queue.filter((id) => F.questionById[id].phase === 5 && F.questionById[id].mustAsk);
    const actQ = act && F.questionById[act];
    if (minutes >= 20 && decisionLeft.length && actQ && actQ.phase < 5 && ui.focusPhase !== 5 && !ui.nudged) {
      parts.push(h('div.lastline.nudge',
        h('span', `${Math.floor(minutes)} minutes in — leave time for who signs, budget, and the next step.`),
        h('button.tbtn', { onclick: () => { ui.nudged = true; app.focusPhase(5); } }, 'Go to Decision'),
        h('button.tbtn', { onclick: () => { ui.nudged = true; app.render(); } }, 'Later')));
    }
    // A topic raised mid-call is done catching up once its earlier-phase questions are asked.
    if (ui.focusModule && !d.focusLeft) ui.focusModule = null;
    if (ui.focusModule) {
      const rest = d.queue.filter((id) => F.questionById[id].module !== ui.focusModule).map((id) => F.questionById[id].phase);
      parts.push(h('div.lastline',
        h('span', `Catching up on ${MOD[ui.focusModule].label} — ${rest.length ? `then back to ${PH[Math.min(...rest)].label}` : 'then you’re caught up'}`),
        h('button.tbtn', { onclick: () => app.focusModule(ui.focusModule) }, 'Skip the catch-up')));
    } else if (ui.focusPhase) {
      const left = d.queue.some((id) => F.questionById[id].phase === ui.focusPhase);
      parts.push(h('div.lastline',
        h('span', left ? `Asking ${PH[ui.focusPhase].label} questions first` : `${PH[ui.focusPhase].label}: all asked`),
        h('button.tbtn', { onclick: () => app.focusPhase(ui.focusPhase) }, 'Back to normal order')));
    }
    // Starting a new phase: say what it's for, and a line to bridge into it.
    if (actQ && last && actQ.phase > last.phase && !ui.pinned && !ui.focusModule) {
      const ph = PH[actQ.phase];
      parts.push(h('div.phase-intro',
        h('div.phase-intro-k', `Phase ${ph.id} of ${F.meta.phases.length} · ${ph.label}`),
        h('p', ph.desc),
        ui.coaching ? h('p.bridge', `Bridge: “${ph.bridge}”`) : null));
    }

    if (!act) {
      parts.push(h('section.question.empty',
        h('div.eyebrow', 'All caught up'),
        h('h1.qtitle', 'Every question in play has an answer'),
        h('p.qwhy', 'Add a topic the customer raised, review the pitch, or wrap up the call.'),
        h('div.qactions', h('div.qa-main',
          h('button.btn.primary', { onclick: () => app.go('wrap') }, 'Wrap up'),
          lockedTopics().length ? h('button.btn', { onclick: () => { ui.addTopic = true; app.render(); } }, 'Add a topic') : null))));
      return parts;
    }

    parts.push(questionBlock(act, isNew));
    const next = ids.filter((id) => id !== act);
    if (next.length) {
      parts.push(h('section.upnext',
        h('div.eyebrow', 'Up next'),
        next.map((id) => {
          const nq = F.questionById[id];
          return h('button.next-row', { onclick: () => { ui.active = id; app.render(); }, title: 'Ask this one now' },
            h('span', nq.text),
            h('span.muted', nq.phase !== (actQ && actQ.phase) ? PH[nq.phase].label : topicLabel(nq) || PH[nq.phase].label));
        })));
    }
    return parts;
  }

  // ── phase review (click a step) ──
  function phaseView(n) {
    const { s, d } = app;
    const ph = PH[n];
    const p = d.phases[n];
    const qs = F.questions.filter((q) => q.phase === n && (d.eligible[q.id] || d.stale[q.id] || F.hasValue(q, s.answers[q.id])));
    const rank = (mid) => (MOD[mid].generic ? -1 : d.topics.indexOf(mid) < 0 ? 99 : d.topics.indexOf(mid));
    const groups = [];
    qs.forEach((q) => {
      let g = groups.find((x) => x.mid === q.module);
      if (!g) groups.push(g = { mid: q.module, qs: [] });
      g.qs.push(q);
    });
    groups.sort((x, y) => rank(x.mid) - rank(y.mid));
    const row = (q) => {
      const a = s.answers[q.id];
      const st = d.stale[q.id] ? 'stale' : F.isAnswered(q, a) ? 'done' : a && a.skipped ? 'skipped' : 'open';
      const pains = d.pains.filter((x) => x.qid === q.id);
      const txt = {
        done: () => F.answerText(q, a) + (pains.length ? ` — ${pains.map((x) => x.metric || 'no number yet').join('; ')}` : ''),
        stale: () => `${F.answerText(q, a)} — no longer applies`,
        skipped: () => 'Skipped',
        open: () => (d.aside[q.module] ? 'Set aside' : 'Not asked yet'),
      }[st]();
      return h('button.row.' + st, { onclick: () => app.pin(q.id) },
        h('span.row-q', q.text, q.mustAsk && st === 'open' && !d.aside[q.module] ? h('span.must', 'Must ask') : null),
        h('span.row-a', txt));
    };
    return [h('section.question.topic',
      h('div.eyebrow', `Phase ${n} of ${F.meta.phases.length}`),
      h('h1.qtitle', ph.label),
      h('p.qwhy', ph.desc),
      qs.length ? h('p.muted.small', `${p.answered} of ${p.eligible} answered${p.skipped ? ` · ${p.skipped} skipped` : ''}. Click a question to ask it or change the answer.`)
        : h('p.muted.small', 'No questions here yet — they appear as topics come up in “why now”.'),
      groups.map((g) => [
        MOD[g.mid].generic ? null : h('div.rows-head', MOD[g.mid].label, d.aside[g.mid] ? h('span.muted', ' · set aside') : null),
        h('div.rows', g.qs.map(row)),
      ]),
      h('div.qactions', h('div.qa-main',
        p.open ? h('button.btn.primary', { onclick: () => app.focusPhase(n) }, 'Ask the rest of this phase now') : null,
        h('button.tbtn', { onclick: () => F.ui.openPhase(n) }, 'Back to the call'))))];
  }

  function mobileTabs() {
    const tab = (id, label) => h('button' + (app.ui.mtab === id ? '.on' : ''), { onclick: () => { app.ui.mtab = id; app.render(); } }, label);
    return h('nav.mtabs', tab('q', 'Question'), tab('pitch', 'Pitch'));
  }

  F.screens.interview = function () {
    return h('div.interview', { 'data-mtab': app.ui.mtab },
      header(),
      stepper(),
      h('div.cols',
        h('main.main', { 'data-scroll': 'main' }, h('div.main-in', app.ui.review ? phaseView(app.ui.review) : questionView())),
        h('aside.side', { 'data-scroll': 'side', 'aria-label': 'Likely pitch' }, F.ui.radar())),
      mobileTabs());
  };

  // ── add a topic the customer raised ──
  F.screens.addTopic = function () {
    const close = () => { app.ui.addTopic = false; app.render(); };
    return h('div.overlay', { onclick: close },
      h('div.modal', { onclick: (e) => e.stopPropagation(), role: 'dialog', 'aria-label': 'Add a topic' },
        h('h2', 'Add a topic the customer raised'),
        h('p.muted', 'Fiv-o catches up on it first — its deadline and environment — then its pains join the Pain & cost phase.'),
        h('div.rows', lockedTopics().map((m) => h('button.row', { onclick: () => app.unlockModule(m.id) },
          h('span.row-q', m.label), h('span.row-a', m.desc)))),
        h('div.modal-foot', h('button.tbtn', { onclick: close }, 'Cancel'))));
  };

  // ── search ──
  function statusOf(q) {
    const { d, s } = app;
    const a = s.answers[q.id];
    if (d.stale[q.id]) return 'no longer applies';
    if (F.isAnswered(q, a)) return 'answered';
    if (a && a.skipped) return 'skipped';
    if (!d.eligible[q.id]) return 'not in play yet';
    return 'open';
  }
  function searchResults() {
    const words = (app.ui.search || '').trim().toLowerCase().split(/\s+/).filter(Boolean);
    const rank = { open: 0, 'no longer applies': 1, skipped: 1, answered: 2, 'not in play yet': 3 };
    return F.questions.filter((q) => {
      const hay = `${q.text} ${q.short} ${MOD[q.module].label} ${PH[q.phase].label} ${(q.options || []).map((o) => o.label).join(' ')}`.toLowerCase();
      return words.every((w) => hay.includes(w));
    }).map((q, i) => ({ q, i, r: words.length ? rank[statusOf(q)] : 0 }))
      .sort((a, b) => a.r - b.r || a.i - b.i)
      .slice(0, 12)
      .map((x) => x.q);
  }
  F.ui.searchPick = function (q) {
    if (!q) return;
    const modOpen = F.router.cond(MOD[q.module].when, app.s, app.d.valid);
    if (!modOpen && Object.values(F.meta.triggerModule).includes(q.module)) app.unlockModule(q.module);
    app.pin(q.id);
  };
  F.ui.openSearch = function () {
    app.ui.search = '';
    app.ui.searchIdx = 0;
    app.render();
    const el = document.querySelector('[data-key="search"]');
    if (el) el.focus();
  };
  F.screens.search = function () {
    const results = searchResults();
    const idx = Math.max(0, Math.min(app.ui.searchIdx, results.length - 1));
    const close = () => { app.ui.search = null; app.render(); };
    return h('div.overlay', { onclick: close },
      h('div.palette', { onclick: (e) => e.stopPropagation(), role: 'dialog', 'aria-label': 'Search questions' },
        h('input.pal-input', {
          'data-key': 'search', value: app.ui.search, placeholder: 'Find a question — e.g. backup, NSX, GPU, budget',
          oninput: (e) => { app.ui.search = e.target.value; app.ui.searchIdx = 0; app.render(); },
          onkeydown: (e) => {
            e.stopPropagation();
            if (e.key === 'ArrowDown') { e.preventDefault(); app.ui.searchIdx = Math.min(idx + 1, results.length - 1); app.render(); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); app.ui.searchIdx = Math.max(idx - 1, 0); app.render(); }
            else if (e.key === 'Enter') { e.preventDefault(); F.ui.searchPick(results[idx]); }
            else if (e.key === 'Escape') { e.preventDefault(); close(); }
          },
        }),
        h('div.pal-list', results.length ? results.map((q, i) => h('button.pal-item' + (i === idx ? '.sel' : ''), {
          onclick: () => F.ui.searchPick(q), onmouseenter: () => { app.ui.searchIdx = i; },

        h('p', h('strong', F.costs.line(c) || 'No numbers yet'), h('span.muted', ` · ${c.quantified} of ${c.count} pain${c.count === 1 ? ' has' : 's have'} a number`)),
        h('label.rate', h('span', 'Hours valued at $'),
          h('input.rate-in', { inputmode: 'numeric', value: String(s.wrap.rate), 'data-key': 'wrap.rate', 'aria-label': 'Loaded hourly rate', oninput: (e) => app.soft((x) => { x.wrap.rate = e.target.value.replace(/[^\d.]/g, ''); }) }),
          h('span', ' an hour (loaded cost of an IT hour)'))),
    ] : h('p.muted', 'No pains captured. Finding them is the first job of the next call.');

    const mp = h('div.rows', d.mp.letters.map((l) => h('div.row.static.stack',
      h('div.mprow',
        h(`span.mp-l.l${l.level}`, l.k),
        h('strong', l.label),
        h('span.muted.small', ['gap', 'partial', 'solid'][l.level]),
        h('button.tbtn.small', { onclick: () => copy(F.report.mpText(s, d, l.k), l.label), style: { marginLeft: 'auto' } }, 'Copy')),
      h('textarea', {
        rows: 1, 'data-key': `mp.${l.k}`, placeholder: l.items.join('; ') || 'Gap — what do you know?',
        oninput: (e) => app.soft((x) => { x.wrap.mp[l.k] = e.target.value; }),
      }, s.wrap.mp[l.k] || ''))));

    const gaps = d.gaps.length ? d.gaps.map((id) => h('label.check',
      h('input', { type: 'checkbox', checked: !s.wrap.gapsExcluded[id], onchange: (e) => app.act((x) => { x.wrap.gapsExcluded[id] = !e.target.checked; }) }),
      h('span', Q[id].text, ' ', h('button.link.small', { onclick: backTo(() => app.pin(id)) }, 'ask now')))) : h('p.muted', 'No open high-value questions.');

    const agreed = d.valid['dec.nextstep'] ? F.answerText(Q['dec.nextstep'], s.answers['dec.nextstep']) : null;

    // Technology interest (with a reason for every "not interested") + the license headline.
    const yes = d.tech.filter((t) => t.status === 'interested');
    const no = d.tech.filter((t) => t.status === 'declined');
    const open = d.tech.filter((t) => t.suggested && !t.status);
    const statusBtns = (t) => h('div.tech-act',
      h('button.tbtn.small' + (t.status === 'interested' ? '.chosen' : ''), { onclick: () => app.setTech(t.id, t.status === 'interested' ? null : 'interested') }, 'Interested'),
      h('button.tbtn.small' + (t.status === 'declined' ? '.chosen.no' : ''), { onclick: () => app.setTech(t.id, t.status === 'declined' ? null : 'declined') }, 'Not interested'));
    const lic = d.license;
    const tech = [
      yes.length || no.length || open.length ? h('div.rows',
        [...yes, ...no, ...open].map((t) => h('div.row.static.wtech',
          h('div.wtech-main', h('strong', t.tech.name), h('span.muted.small', t.status === 'interested' ? 'Interested' : t.status === 'declined' ? 'Not interested' : 'Suggested — not pitched yet')),
          statusBtns(t),
          t.status === 'declined' ? h('input', {
            placeholder: 'Why not? (goes in the notes)', value: t.note, 'data-key': `tn.${t.id}`,
            oninput: (e) => app.soft((x) => F.state.setTechNote(x, t.id, e.target.value)),
          }) : null)))
        : h('p.muted', 'No technologies suggested or marked yet.'),
      lic && lic.ready ? h('p.lic-sum', h('span.muted', 'License sketch: '), h('strong', lic.headline),
        lic.core[0].qty ? h('span.muted', ` · ${lic.core[0].qty}`) : null,
        lic.addons.length ? h('span.muted', ` · plus ${lic.addons.map((a) => a.title).join(', ')}`) : null,
        ' ', h('button.link.small', { onclick: () => copy(F.licensingEngine.toText(lic), 'License sketch') }, 'copy')) : null,
    ];

    return h('div.page.wrap',
      h('div.topbar',
        h('button.tbtn', { onclick: () => app.go('interview') }, '← Back to the call'),
        h('button.tbtn', { onclick: () => app.go('home'), style: { marginLeft: 'auto' } }, 'Home')),
      h('h1', `Wrap up — ${s.setup.account}`),
      h('p.muted', 'Six quick checks, then copy the notes into Salesforce. Everything you change here updates the notes on the right.'),
      h('div.wrap-grid',
        h('div.wrap-left',
          step(1, 'Primary pitch', 'Ranked from their answers. Pick the one to lead with.', pitch),
          step(2, 'Technology and licensing', 'What they want, what they turned down (and why), and the license it adds up to.', tech),
          step(3, 'Cost of pain', 'The number behind each pain, from the call. Blanks go on the next call’s agenda. The total adds numbers as given — check for overlap before using it in a business case.', pains),
          step(4, 'MEDDPICC', 'Filled from their answers (shown in grey). Type to replace what goes into the notes.', mp),
          step(5, 'Open questions for next time', 'Checked items go into the notes as the next call’s agenda.', gaps),
          step(6, 'Next steps and notes', null,
            agreed ? h('p', h('span.muted', 'Agreed on the call: '), agreed) : h('p.muted', 'No next step was recorded — add one with an owner and a date.'),
            h('label.lf', h('span', 'Next steps'), h('textarea', { rows: 3, 'data-key': 'wrap.next', placeholder: 'Owner — action — date (one per line)', oninput: (e) => app.soft((x) => { x.wrap.nextSteps = e.target.value; }) }, s.wrap.nextSteps || '')),
            h('label.lf', h('span', 'Other notes'), h('textarea', { rows: 3, 'data-key': 'wrap.notes', placeholder: 'Anything else for the opportunity record', oninput: (e) => app.soft((x) => { x.wrap.notes = e.target.value; }) }, s.wrap.notes || '')))),
        h('div.wrap-right',
          h('section.notes-panel',
            h('div.notes-head', h('h2', 'CRM notes'), h('span.muted.small', 'Plain text — pastes cleanly into Salesforce')),
            h('div.notes-actions',
              h('button.btn.primary', { onclick: () => copy(notes, 'Notes') }, 'Copy notes'),
              h('button.btn', { onclick: () => copy(F.report.meddpicc(s, d), 'MEDDPICC') }, 'Copy MEDDPICC')),
            h('div.notes-more',
              h('button.tbtn.small', { onclick: () => download(`${fname}.txt`, notes) }, 'Download .txt'),
              h('button.tbtn.small', { onclick: () => download(`fivo-${slug(s.setup.account)}.json`, F.state.exportJSON(s), 'application/json'), title: 'Keep this to resume or run call 2 on another machine' }, 'Save session (.json)'),
              h('button.tbtn.small', { onclick: () => window.print() }, 'Print')),
            h('pre.notes', { id: 'print-notes', 'data-scroll': 'notes' }, notes)))));
  };
})(globalThis.Fivo = globalThis.Fivo || {});


/* ── src/ui/hotkeys.js ── */
/* Fiv-o UI: keyboard-first controls for live calls. */
(function (F) {
  'use strict';

  const app = F.app;
  const KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'];
  const typing = (el) => el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);

  document.addEventListener('keydown', (e) => {
    const ui = app.ui;
    if (e.metaKey || e.ctrlKey || e.altKey) return;

    // Keys typed into a field belong to that field (check the target too: a field can be
    // re-rendered away while its own handler runs).
    const inField = typing(e.target) || typing(document.activeElement);

    // Esc peels back one layer at a time; with nothing open it hides the screen.
    if (e.key === 'Escape') {
      if (inField && ui.search === null) { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); return; }
      if (ui.blur) { ui.blur = false; app.render(); return; }
      if (ui.search !== null) { ui.search = null; app.render(); return; }
      if (ui.help) { ui.help = false; app.render(); return; }
      if (ui.addTopic) { ui.addTopic = false; app.render(); return; }
      if (ui.techPicker) { ui.techPicker = false; app.render(); return; }
      if (ui.drawer) { ui.drawer = null; app.render(); return; }
      if (ui.screen === 'interview' && ui.review) { ui.review = null; app.render(); return; }
      if (ui.screen === 'interview') { ui.blur = true; app.render(); }
      return;
    }
    if (ui.blur || inField) return;
    if (e.key === '?') { ui.help = !ui.help; app.render(); e.preventDefault(); return; }
    if (ui.screen !== 'interview' || ui.search !== null || ui.help || ui.addTopic || ui.techPicker) return;

    const k = e.key.toLowerCase();
    if (ui.drawer) {
      if (k === 'p') { ui.drawer = null; app.render(); }
      return;
    }

    const ids = F.ui.cluster();
    const qid = F.ui.activeId();
    const q = qid && F.questionById[qid];
    const hit = () => e.preventDefault();

    if (q && q.options && KEYS.includes(e.key)) {
      const o = q.options[KEYS.indexOf(e.key)];
      if (o) { hit(); F.ui.pick(q.id, o.id); }
      return;
    }
    if (e.key === 'Enter' && q) {
      hit();
      if (q.type !== 'single') F.ui.finish(q.id);
      else if (ui.pinned === q.id) app.proceed(q.id);
      return;
    }
    if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && q) {
      hit();
      const i = Math.max(0, ids.indexOf(qid));
      ui.active = ids[(i + (e.key === 'ArrowDown' ? 1 : ids.length - 1)) % ids.length];
      app.render();
      return;
    }
    switch (k) {
      case '/': hit(); F.ui.openSearch(); break;
      case 's': if (q) { hit(); app.skip(q.id); } break;
      case 'b': hit(); app.undo(); break;
      case 'n': if (q) { hit(); F.ui.openNote(q.id); } break;
      case 'q': if (q) { hit(); F.ui.openQuote(q.id); } break;
      case 'h': if (q) { hit(); F.ui.toggleAsk(); } break;
      case 'l': hit(); ui.sideTab = ui.sideTab === 'license' ? 'pitch' : 'license'; app.render(); break;
      case 'c': hit(); app.setPref('coaching', !ui.coaching); break;
      case 'p': if (app.d.primary && app.d.primary.score > 0) { hit(); F.ui.openDrawer(app.d.primary.id); } break;
      case 'w': hit(); app.go('wrap'); break;
      default: break;
    }
  });
})(globalThis.Fivo = globalThis.Fivo || {});


/* ── src/ui/main.js ── */
/* Fiv-o UI: boot, theme, and the call timer. */
(function (F) {
  'use strict';

  const app = F.app;
  const theme = F.dom.prefs.get('theme', null);
  if (theme) document.documentElement.dataset.theme = theme;

  F.ui.toggleTheme = function () {
    const dark = document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === 'dark'
      : window.matchMedia('(prefers-color-scheme: dark)').matches;
    const next = dark ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    F.dom.prefs.set('theme', next);
  };

  // Timer: only touches the one element, so it never disturbs typing.
  setInterval(() => {
    const el = document.getElementById('timer');
    if (el) el.textContent = F.ui.elapsed();
  }, 1000);

  // Flush autosave before the tab closes.
  window.addEventListener('beforeunload', () => { if (app.s) F.state.save(app.s); });

  app.render();
})(globalThis.Fivo = globalThis.Fivo || {});
